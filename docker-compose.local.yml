services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LOGTO_ISSUER: ${LOGTO_ISSUER}
        NEXT_PUBLIC_LOGTO_CLIENT_ID: ${LOGTO_CLIENT_ID}
        NEXT_PUBLIC_LOGTO_SCOPE: ${LOGTO_SCOPE}
        NEXT_PUBLIC_NEW_API_BASE_URL: ${NEW_API_BASE_URL}
        NEXT_PUBLIC_NEW_API_PUBLIC_URL: ${NEW_API_PUBLIC_URL}
        NEXT_PUBLIC_NEW_API_DISPLAY_NAME: ${NEW_API_DISPLAY_NAME}
        NEXT_PUBLIC_NEW_API_LOGTO_AUDIENCE: ${NEW_API_LOGTO_AUDIENCE}
        NEXT_PUBLIC_NEW_API_LOGTO_SCOPE: ${NEW_API_LOGTO_SCOPE}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped
