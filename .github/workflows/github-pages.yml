name: GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install

      - name: Build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_LOGTO_ISSUER: ${{ vars.LOGTO_ISSUER }}
          VITE_LOGTO_CLIENT_ID: ${{ vars.LOGTO_CLIENT_ID }}
          VITE_LOGTO_SCOPE: ${{ vars.LOGTO_SCOPE }}
          VITE_NEW_API_PUBLIC_URL: ${{ vars.NEW_API_PUBLIC_URL }}
          VITE_NEW_API_BASE_URL: ${{ vars.NEW_API_BASE_URL }}
          VITE_NEW_API_DISPLAY_NAME: ${{ vars.NEW_API_DISPLAY_NAME }}
          VITE_NEW_API_LOGTO_AUDIENCE: ${{ vars.NEW_API_LOGTO_AUDIENCE }}
          VITE_NEW_API_LOGTO_SCOPE: ${{ vars.NEW_API_LOGTO_SCOPE }}
        run: bun run build

      - name: Add SPA fallback
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
